name: Compare Visa Cal patches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out minimal patch
        uses: actions/checkout@v7
        with:
          path: minimal
          persist-credentials: false

      - name: Check out full diagnostics patch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: full-diagnostics
          persist-credentials: false

      - name: Restore full diagnostics patch
        working-directory: full-diagnostics
        run: git show 2db52a6479684f4e1654882487cdc01a96032b79:patches/israeli-bank-scrapers+6.12.1.patch > patches/israeli-bank-scrapers+6.12.1.patch

      - name: Build comparison images locally
        run: |
          docker build --tag moneyman:full-diagnostics ./full-diagnostics >/dev/null 2>&1
          docker build --tag moneyman:minimal ./minimal >/dev/null 2>&1

      - name: Run Visa Cal comparison
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: "moneyman:*,israeli-bank-scrapers:*"
          TZ: "Asia/Jerusalem"
          MONEYMAN_UNSAFE_STDOUT: "false"
          SEND_NEW_CONFIG_TO_TG: "false"
        run: |
          run_variant() {
            variant="$1"
            image="$2"
            docker run --rm \
              --shm-size=2g \
              --security-opt seccomp=unconfined \
              -e MONEYMAN_CONFIG \
              -e DEBUG \
              -e TZ \
              -e MONEYMAN_UNSAFE_STDOUT \
              -e SEND_NEW_CONFIG_TO_TG \
              -e MONEYMAN_LOG_FILE_PATH="/tmp/moneyman-${variant}.log" \
              "$image" >/dev/null 2>&1
          }

          set +e
          run_variant minimal moneyman:minimal
          minimal_result=$?
          run_variant full-diagnostics moneyman:full-diagnostics
          full_result=$?
          set -e

          if [ "$full_result" -ne 0 ] || [ "$minimal_result" -ne 0 ]; then
            exit 1
          fi
