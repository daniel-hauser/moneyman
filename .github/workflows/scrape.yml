name: Scrape

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123' for PR #123)"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
  schedule:
    # In Israel: [12:05, 00:05] or [13:05, 01:05] on DST
    - cron: "5 10,22 * * *"
env:
  REGISTRY: ghcr.io
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - id: normalize-repository-name
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - id: set-container-image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> $GITHUB_OUTPUT

      - name: Create run metadata
        env:
          CONTAINER_IMAGE: ${{ steps.set-container-image.outputs.image }}
          INPUT_CONTAINER_TAG: ${{ github.event.inputs.containerTag || 'latest' }}
          INPUT_SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg || 'false' }}
          INPUT_DEBUG: ${{ github.event.inputs.DEBUG || '' }}
        run: |
          metadata=$(jq -cn \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg containerImage "$CONTAINER_IMAGE" \
            --arg containerTag "$INPUT_CONTAINER_TAG" \
            --arg sendNewConfigToTg "$INPUT_SEND_NEW_CONFIG_TO_TG" \
            --arg debug "$INPUT_DEBUG" \
            '{
              runId: $runId,
              runAttempt: $runAttempt,
              runUrl: $runUrl,
              workflow: $workflow,
              event: $event,
              ref: $ref,
              workflowSha: $workflowSha,
              containerImage: $containerImage,
              inputs: {
                containerTag: $containerTag,
                sendNewConfigToTg: ($sendNewConfigToTg == "true"),
                DEBUG: $debug
              }
            }')
          echo "MONEYMAN_RUN_METADATA=$metadata" >> "$GITHUB_ENV"

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      - name: Run scraper
        run: >
          docker run --rm
          -e MONEYMAN_CONFIG
          -e DEBUG
          -e TZ
          -e SEND_NEW_CONFIG_TO_TG
          -e MONEYMAN_RUN_METADATA
          ${{ steps.set-container-image.outputs.image }}
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: "Asia/Jerusalem"
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
